name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TASK_CONFIG_DB_HOST: 127.0.0.1
  TASK_CONFIG_DB_PORT: 5432
  TASK_CONFIG_DB_USER: task_manager
  TASK_CONFIG_DB_PASSWORD: task_manager
  TASK_CONFIG_DB_NAME: task_manager_test
  TASK_CONFIG_AUTH_JWT_SECRET: ci-only-jwt-secret
  TASK_CONFIG_AUTH_PASSWORD_SALT: ci-only-password-salt
  TASK_CONFIG_AGENT_PLANNER_MODEL_NAME: ci-planner
  TASK_CONFIG_AGENT_SUBAGENT_MODEL_NAME: ci-subagent
  TASK_CONFIG_AGENT_BASE_URL: https://example.invalid
  TASK_CONFIG_AGENT_BASE_API_KEY: ci-only-api-key
  TASK_CONFIG_COORDINATION_REDIS_URL: redis://127.0.0.1:6379/1

jobs:
  backend:
    name: Backend quality and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v8
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run lint checks
        run: uv run ruff check .

      - name: Run type checks
        run: uv run basedpyright

      - name: Run unit tests
        run: uv run pytest tests/unit

  integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: task_manager
          POSTGRES_PASSWORD: task_manager
          POSTGRES_DB: task_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task_manager -d task_manager_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v8
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run integration tests
        run: uv run pytest tests/integration

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run lint checks
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build and check bundle budgets
        run: npm run check:performance
